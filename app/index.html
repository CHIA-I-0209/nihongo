<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日語帳</title>
  <meta name="description" content="記單字、練文法的日文學習 App">
  <meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141A26" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="日語帳">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字型非阻塞載入：網路慢或被擋時先用系統字型，不會卡住畫面 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="主選單">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>學習</span>
    </a>
    <a href="#/words" data-tab="words">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="12" height="15" rx="1.5"/><path d="M8 5V3.5h11.5V17H16"/></svg>
      <span>單字</span>
    </a>
    <a href="#/grammar" data-tab="grammar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      <span>文法</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <button type="button" id="to-top" class="to-top" aria-label="回到最上面" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/main.js"></script>
  <script>
    // 保險：App 沒有在 8 秒內啟動（例如更新時檔案沒上傳齊），就顯示說明和「重新載入」按鈕，
    // 按下去會清掉舊的快取再重新整理，不會停在一片空白
    setTimeout(function () {
      if (window.__appStarted) return;
      var v = document.getElementById('view');
      if (!v || v.children.length) return;
      v.innerHTML = '<section class="home"><h1 class="lead">App 沒有正常啟動</h1>'
        + '<p class="help">可能是更新時有檔案沒上傳齊，或網路不穩。先按下面的按鈕重新載入；還是不行的話，請確認 GitHub 上的檔案都是最新版。</p>'
        + '<button type="button" class="primary big" id="hard-reload">重新載入</button></section>';
      document.getElementById('hard-reload').onclick = function () {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
    }, 8000);
  </script>
</body>
</html>
